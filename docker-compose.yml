version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ~/.cache/ultralytics:/root/.cache/ultralytics
      - ~/.cache/torch:/root/.cache/torch
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vision_ai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
